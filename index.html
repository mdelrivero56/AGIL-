<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sprint Manager · Bi-nnova</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;--card:#fff;--tx:#14213d;--mu:#64708a;--bd:#dde3ee;--pr:#1e3a8a;--ac:#c9a227;--ok:#2f855a;--bad:#c53030;--in:#eef2f9}
:root[data-theme="dark"]{--bg:#0c1426;--card:#142038;--tx:#e8edf8;--mu:#93a1bf;--bd:#26365a;--pr:#6b8cf0;--in:#0f1a30}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14.5px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 8px}small,.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(20,33,61,.08)}header.top{background:linear-gradient(135deg,#0f1f4d,#1e3a8a);box-shadow:0 2px 8px rgba(0,0,0,.25);color:#fff;padding:14px 16px}header.top small{color:#b8c4e6}header.top .btn{background:transparent;color:#fff;border-color:#4a5f9e}.kpi small{text-transform:uppercase;letter-spacing:.4px;font-size:11px}.ch{border-radius:10px;padding:1px 9px;font-size:12px;font-weight:600}.g{background:#dcf2e5;color:#1d6b43}.n{background:#e6eaf3;color:#475572}.r{background:#fbe3e3;color:#9b2c2c}.note{border-left:4px solid var(--ac);background:var(--in);padding:8px 10px;border-radius:4px;margin-bottom:12px}.li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}@media print{nav,header,.noprint{display:none!important}}
nav{display:flex;gap:6px;overflow-x:auto;margin:12px 0}
nav button,.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit;white-space:nowrap}
nav button.on,.btn.p{background:var(--pr);color:#fff;border-color:var(--pr)}[data-theme=dark] .btn.p,[data-theme=dark] nav button.on{color:#0c1426}
.btn.s{padding:2px 8px;font-size:13px}.btn.d{color:var(--bad)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:8px;padding:7px;max-width:100%}
textarea{width:100%;min-height:90px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row>label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--in);border-radius:10px;padding:10px}.kpi b{display:block;font-size:22px}
.bar{height:8px;background:var(--in);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.col{background:var(--in);border-radius:10px;padding:8px;min-height:120px}.col h3{font-size:13px;margin:0 0 8px;color:var(--mu)}
.it{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px;margin-bottom:8px}
.it .t{font-weight:600}.pt{background:var(--ac);color:#222;border-radius:10px;padding:0 7px;font-size:12px;font-weight:700}
.it .a{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.tbl{width:100%;border-collapse:collapse}.tbl td,.tbl th{padding:6px;border-bottom:1px solid var(--bd);text-align:left}
.scroll{overflow-x:auto}svg{max-width:100%;height:auto}
.tag{font-size:12px;color:var(--mu)}
.card>h2{padding-bottom:6px;border-bottom:2px solid var(--in)}
.kpi{border-left:4px solid var(--pr)}.kpi b{color:var(--pr)}nav{border-bottom:1px solid var(--bd);padding-bottom:8px}nav button{border-radius:20px}
.col{border-top:3px solid #94a3b8}.col[data-c=doing]{border-color:#3b82f6}.col[data-c=blocked]{border-color:var(--bad)}.col[data-c=done]{border-color:var(--ok)}.it{border-left:3px solid var(--ac)}
.bar i{background:linear-gradient(90deg,var(--pr),#4f7cf0)}.ring{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.lg{display:flex;gap:6px;font-size:13px}.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:14px}.g3>.card{margin:0}.rc{border-radius:10px;padding:12px;background:var(--in);border-top:3px solid}
.row>.btn{white-space:normal;text-align:left;max-width:100%}.row>label{min-width:0;max-width:100%}.row>label>input,.row>label>select{max-width:100%;min-width:0}
.card{animation:fi .45s ease both}@keyframes fi{from{opacity:0;transform:translateY(8px)}}.bar i{transition:width .8s}@media (prefers-reduced-motion:reduce){.card{animation:none}.bar i{transition:none}}
body.locked header.top,body.locked main{display:none}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,#0f1f4d,#1e3a8a)}
body:not(.locked) #gate{display:none}
.gcard{width:100%;max-width:400px;background:var(--card);border-radius:16px;padding:28px 24px;box-shadow:0 10px 40px rgba(0,0,0,.35);animation:fi .45s ease both}
.gcard h1{font-size:22px;margin:4px 0}.gcard h2{border:0;font-size:17px}.gl{font-size:34px;color:var(--ac);line-height:1}
.gcard label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px;margin:12px 0}.gcard input{width:100%}
.gcard .btn.p{width:100%;margin-top:6px;padding:10px}.gcard a{color:var(--pr);font-size:13px}
.gm{color:var(--bad);font-size:13px;min-height:18px}.gcode{font:700 19px/1.4 ui-monospace,Consolas,monospace;letter-spacing:1px;text-align:center;background:var(--in);border:1px dashed var(--ac);border-radius:10px;padding:14px;margin:12px 0;word-break:break-all}
</style></head><body class="locked"><div id="gate"></div><header class="top"><div class="row" style="justify-content:space-between;align-items:center;max-width:1100px;margin:0 auto"><div><h1>Sprint Manager</h1><small>Seguimiento ágil · Coordinación de Política Digital · Complemento de Bi-nnova</small></div><div class="row" style="align-items:center"><small id="st"></small><button class="btn" id="sv" onclick="A.saveNow()">💾 Guardar</button><button class="btn" onclick="A.theme()" title="Modo claro / oscuro">◐</button><button class="btn" onclick="A.exp()">Exportar</button><button class="btn" onclick="G.out()" title="Cerrar sesión">⎋ Salir</button><button class="btn" onclick="$('#imp').click()">Importar</button><input id="imp" type="file" accept=".json" hidden onchange="A.imp(this)"></div></div></header><main><nav id="nav"></nav><div id="v"></div></main>
<script>
const $=s=>document.querySelector(s),K='sprint-binnova-v1';
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEPTS=['Desarrollo de Software','Autoridad Certificadora','Estrategias Digitales'];
const COLS=[['todo','Por hacer'],['doing','En progreso'],['blocked','Bloqueado'],['done','Hecho']];
const PRJ=['Bolsa de Trabajo','Figura CPD','Sistema de citas AC','Minuta y Lista de Asistencia','App lanzamiento: menú de firmas','CPD Academy','CPMS 3.0','Denuncias – Comité de Ética','SITA 3.1','Portal de Gobierno del Estado','Gestor de Folios','Elecciones'];
const uid=()=>Math.random().toString(36).slice(2,9);
async function saveFile(name,text,type){let d=null;try{d=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
 if(d){try{await d.save({filename:name,data:text})}catch(e){if(!e||e.code!='declined')alert('No se pudo guardar el archivo')}return}
 if(window.claude)return alert('La descarga no está disponible en esta vista.');
 const u=URL.createObjectURL(new Blob([text],{type})),l=document.createElement('a');l.href=u;l.download=name;l.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){}};
const arr=x=>Array.isArray(x)?x:(x&&typeof x=='object'?Object.values(x):[]);
const cid=o=>{o=o&&typeof o=='object'?o:{};o.id=String(o.id??'').replace(/[^\w-]/g,'')||uid();return o},fixTone=o=>{if(!['g','n','r'].includes(o.tone))o.tone='n';return o};
function norm(d){d=d&&typeof d=='object'?d:{};
d.sprints=arr(d.sprints).map(s=>({...cid(s),items:arr(s.items).map(i=>cid(i)),dailies:arr(s.dailies).map(i=>cid(i)),retro:s.retro||{bien:'',mejorar:'',acc:''}}));
d.backlog=arr(d.backlog).map(i=>cid(i));
d.projects=arr(d.projects).map(p=>({...cid(p),ms:arr(p.ms),rk:arr(p.rk),vw:arr(p.vw).map(v=>fixTone(v)),dc:arr(p.dc)}));
d.topics=arr(d.topics).map(t=>({...cid(t),posts:arr(t.posts).map(v=>fixTone(cid(v)))}));return d}
{const th=ls(K+'-th');if(th)document.documentElement.dataset.theme=th}
let S;try{S=JSON.parse(ls(K))}catch(e){}
S=S||{sprints:[],backlog:[],tab:'board'};
let FD=0;const ST={ready:0,dirty:0,err:'',ver:0,timer:null,pending:0};
const DBU=()=>DBH?'db':'';
const TPL={lms:{m:['Alcance y requerimientos','Estructura de cursos y rutas','Carga de contenidos','Piloto con usuarios','Lanzamiento'],r:['Contenido no listo a tiempo','Baja adopción de usuarios']},den:{m:['Flujo de atención definido','Canal de recepción habilitado','Protocolo de confidencialidad','Pruebas del sistema','Capacitación al comité'],r:['Seguridad y confidencialidad de la información','Decisiones pendientes del comité']}};
const NP=(id,name,note)=>({id,name,goal:'',pct:0,ms:[],rk:[],vw:[],dc:[],note});
const DEF_P=()=>[NP('lms','LMS · CPD Academy',''),NP('den','Denuncias · Comité de Ética e Igualdad de Género','Confidencial: registra solo el avance del sistema, nunca datos de casos ni de personas involucradas.')];
function ensure(){S=norm(S);if(!S.projects.length)S.projects=DEF_P();if(!S.topics.length)S.topics=[{id:'gen',name:'General',desc:'Ideas, sugerencias y opiniones del equipo',posts:[]}];if(!S.projects.some(p=>p.id==S.pid))S.pid=S.projects[0].id;if(!S.topics.some(t=>t.id==S.tid))S.tid=S.topics[0].id;S.tab=S.tab||'board'}
ensure();
const lsSave=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const save=()=>{S._ts=Date.now();lsSave();ST.last=new Date();push();showStatus()};
const editing=()=>/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'');
function showStatus(){const e=$('#st');if(!e)return;e.textContent=!DBU()?'💾 Guardado en este navegador'+(ST.last?' · '+ST.last.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):''):ST.err?'⚠ '+ST.err:ST.dirty?'Guardando…':'☁ Sincronizado'+(ST.last?' · '+ST.last.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'')}
let DBH=null,DOC=null;
function push(){if(!DBH||!ST.ready)return;ST.dirty=1;ST.ver++;clearTimeout(ST.timer);ST.timer=setTimeout(flush,700);showStatus()}
async function flush(){const v=ST.ver,o=JSON.parse(JSON.stringify(S));['tab','pid','tid'].forEach(k=>delete o[k]);
 try{await DOC.set(o);if(v==ST.ver)ST.dirty=0;ST.err='';ST.last=new Date()}
 catch(e){ST.dirty=0;ST.err=(e&&e.code=='invalid_argument')?'Solo lectura: no tienes permiso para editar':'No se pudo guardar en la nube';}showStatus()}
function applyRemote(d){const k={tab:S.tab,pid:S.pid,tid:S.tid};S=norm(d);S.tab=k.tab;S.pid=k.pid;S.tid=k.tid;ensure();lsSave();if(editing()||FD)ST.pending=1;else R()}
async function initDb(){try{const c=window.claude&&await window.claude.use('db');if(!c)return;DBH=c;DOC=c.doc('app/main');
 DOC.onSnapshot(snap=>{ST.err='';
  if(!snap.exists){if(!ST.ready){ST.ready=1;S._ts=S._ts||Date.now();lsSave();push()}}
  else{const d=JSON.parse(JSON.stringify(snap.data()));const first=!ST.ready;ST.ready=1;if(ST.dirty){showStatus();return}
   const rt=d._ts||0,lt=S._ts||0;if(first||rt>lt)applyRemote(d)}
  showStatus()},e=>{ST.err='Sin conexión con la base compartida';showStatus()});showStatus()}catch(e){}}
document.addEventListener('input',e=>{if(e.target.closest&&e.target.closest('#v')&&!e.target.hasAttribute('oninput'))FD=1});
window.addEventListener('beforeunload',e=>{if(ST.dirty){e.preventDefault();e.returnValue=''}});
document.addEventListener('focusout',()=>{if(ST.pending&&!FD)setTimeout(()=>{if(ST.pending&&!editing())R()},300)});

const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),today=()=>fmt(new Date());
const act=()=>{const a=S.sprints.find(s=>s.status==='active');if(a&&!Array.isArray(a.dailies))a.dailies=[];return a},sum=a=>a.reduce((x,i)=>x+i.pts,0);
const addD=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return fmt(x)};
const wdays=(a,b)=>{const r=[];for(let d=a;d<=b;d=addD(d,1)){const w=new Date(d+'T12:00').getDay();if(w&&w<6)r.push(d)}return r};
const closedSprints=()=>S.sprints.filter(s=>s.status==='closed');
const avgVel=()=>{const c=closedSprints();return c.length?Math.round(c.reduce((x,s)=>x+s.velocity,0)/c.length):0};
const sel=(id,arr,v)=>`<select id="${id}">${arr.map(o=>`<option ${o==v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
const TABS=[['board','Tablero'],['daily','Daily Scrum'],['plan','Planeación'],['proj','Proyectos y opiniones'],['topics','Temas del equipo'],['metrics','Métricas'],['close','Cierre del Sprint'],['hist','Historial'],['guide','Guía Scrum'],['sync','Compartir']];

const A={
 tab(t){S.tab=t;lsSave();R()},
 newSprint(){const n=$('#sn').value.trim();if(!n)return alert('Ponle nombre al sprint');if(!$('#ss').value||!$('#se').value||$('#se').value<$('#ss').value)return alert('Revisa las fechas: el fin no puede ser anterior al inicio');
  S.sprints.push({id:uid(),name:n,goal:$('#sg').value,dept:$('#sd').value,start:$('#ss').value,end:$('#se').value,status:'active',items:[],dailies:[],review:'',retro:{bien:'',mejorar:'',acc:''}});S.tab='plan';save();R()},
 add(){const t=$('#it').value.trim();if(!t)return;S.backlog.push({id:uid(),title:t,project:$('#ip').value,owner:$('#io').value,pts:+$('#ipt').value,status:'todo'});save();R()},
 toSprint(id){const a=act(),i=S.backlog.findIndex(x=>x.id==id);if(!a||i<0)return;const [x]=S.backlog.splice(i,1);x.status='todo';a.items.push(x);save();R()},
 toBack(id){const a=act(),i=a?a.items.findIndex(x=>x.id==id):-1;if(i<0)return;const [x]=a.items.splice(i,1);x.status='todo';delete x.doneAt;S.backlog.push(x);save();R()},
 move(id,d){const a=act(),x=a&&a.items.find(i=>i.id==id);if(!x)return;const k=COLS.findIndex(c=>c[0]==x.status),n=COLS[k+d];if(!n)return;x.status=n[0];n[0]=='done'?x.doneAt=today():delete x.doneAt;save();R()},
 del(id){if(!confirm('¿Eliminar?'))return;S.backlog=S.backlog.filter(x=>x.id!=id);const a=act();if(a)a.items=a.items.filter(x=>x.id!=id);save();R()},
 note(f,v){const a=act();if(!a)return;f=='review'?a.review=v:a.retro[f]=v;save()},
 close(){const a=act();if(!confirm('¿Cerrar el sprint? Lo no terminado regresa al backlog.'))return;
  a.committed=sum(a.items);a.velocity=sum(a.items.filter(i=>i.status=='done'));a.closedAt=today();a.status='closed';
  a.items.filter(i=>i.status!='done').forEach(i=>{i.status='todo';S.backlog.push(i)});a.items=a.items.filter(i=>i.status=='done');S.tab='hist';save();R()},
 copy(){const a=act(),m={};a.items.forEach(i=>(m[i.project]=m[i.project]||[]).push(i));
  const t=Object.entries(m).map(([p,l])=>{const tot=sum(l),dn=sum(l.filter(i=>i.status=='done'));return `${p} — avance del sprint ${Math.round(dn/tot*100)}% (${dn}/${tot} pts)\nHecho: ${l.filter(i=>i.status=='done').map(i=>i.title).join('; ')||'—'}\nPendiente: ${l.filter(i=>i.status!='done').map(i=>i.title).join('; ')||'—'}`}).join('\n\n');
  navigator.clipboard?.writeText(t).then(()=>alert('Copiado. Pégalo en la descripción de avance de Bi-nnova.'),()=>prompt('Copia:',t))},
 pj(){return S.projects.find(p=>p.id==S.pid)},
 pick(id){S.pid=id;lsSave();R()},
 set(f,v){A.pj()[f]=f=='pct'?+v:v;save();if(f=='pct')R()},
 tpl(){const p=A.pj(),t=TPL[p.id];if(!t)return;p.ms.push(...t.m.filter(x=>!p.ms.some(m=>m.t==x)).map(x=>({t:x,st:0})));p.rk.push(...t.r.filter(x=>!p.rk.some(r=>r.t==x)).map(x=>({t:x})));save();R()},
 cyc(i){const m=A.pj().ms[i];m.st=(m.st+1)%3;save();R()},
 addp(k){const g=x=>($('#'+k+x)||{value:''}).value.trim(),o={ms:()=>({t:g('t'),st:0}),rk:()=>({t:g('t')}),vw:()=>({who:g('w'),role:g('r'),tone:$('#vto').value,t:g('t')}),dc:()=>({t:g('t'),who:g('w'),due:$('#dcd').value})}[k]();if(!o.t)return;A.pj()[k].push(o);save();R()},
 rmp(k,i){A.pj()[k].splice(i,1);save();R()},
 rep(){const p=A.pj(),T={g:'Positiva',n:'Neutral',r:'Preocupación'},EST=['Pendiente','En curso','Hecho'],t=`${p.name}\nAvance reportado: ${p.pct}%\nObjetivo: ${p.goal||'—'}\n\nHitos:\n${p.ms.map(m=>`- ${m.t}: ${EST[m.st]}`).join('\n')||'—'}\n\nRiesgos:\n${p.rk.map(r=>'- '+r.t).join('\n')||'—'}\n\nPuntos de vista:\n${p.vw.map(v=>`- ${v.who} (${v.role}) [${T[v.tone]}]: ${v.t}`).join('\n')||'—'}\n\nAcuerdos:\n${p.dc.map(d=>`- ${d.t} — ${d.who||'s/r'} ${d.due||''}`).join('\n')||'—'}`;navigator.clipboard?.writeText(t).then(()=>alert('Resumen copiado'),()=>prompt('Copia:',t))},
 pickT(id){S.tid=id;lsSave();R()},
 tp(){return S.topics.find(t=>t.id==S.tid)||S.topics[0]},
 tset(f,v){A.tp()[f]=v;save()},
 newTopic(){const n=(prompt('Nombre del nuevo tema (ej. Mejoras al proceso, Capacitación…)')||'').trim();if(!n)return;const t={id:uid(),name:n,desc:'',posts:[]};S.topics.push(t);S.tid=t.id;save();R()},
 renTopic(){const t=A.tp(),n=(prompt('Nuevo nombre del tema',t.name)||'').trim();if(!n)return;t.name=n;save();R()},
 delTopic(){if(S.topics.length<2)return alert('Debe quedar al menos un tema');const t=A.tp();if(!confirm('¿Eliminar el tema "'+t.name+'" y todas sus opiniones?'))return;S.topics=S.topics.filter(x=>x.id!=t.id);S.tid=S.topics[0].id;save();R()},
 post(){const w=$('#tw').value.trim(),t=$('#tt').value.trim();if(!w||!t)return alert('Escribe tu nombre y tu comentario');ls(K+'-me',w);A.tp().posts.push({id:uid(),who:w,role:$('#tr').value.trim(),tone:$('#tto').value,t,date:today(),likes:0});save();R()},
 like(id){const p=A.tp().posts.find(x=>x.id==id);if(p){p.likes=(p.likes||0)+1;save();R()}},
 delPost(id){if(!confirm('¿Eliminar este comentario?'))return;const t=A.tp();t.posts=t.posts.filter(x=>x.id!=id);save();R()},
 newProj(){const n=(prompt('Nombre del nuevo proyecto')||'').trim();if(!n)return;const p=NP(uid(),n,'');S.projects.push(p);S.pid=p.id;save();R()},
 renProj(){const p=A.pj(),n=(prompt('Nuevo nombre del proyecto',p.name)||'').trim();if(!n)return;p.name=n;save();R()},
 delProj(){if(S.projects.length<2)return alert('Debe quedar al menos un proyecto');const p=A.pj();if(!confirm('¿Eliminar el proyecto "'+p.name+'" con sus hitos, riesgos, opiniones y acuerdos?'))return;S.projects=S.projects.filter(x=>x.id!=p.id);S.pid=S.projects[0].id;save();R()},
 me(v){ls(K+'-me',v.trim())},
 dly(){const a=act();if(!a)return;const w=$('#dw').value.trim();if(!w)return alert('Escribe tu nombre');a.dailies=arr(a.dailies);a.dailies.push({id:uid(),date:today(),dept:$('#dd').value,who:w,yest:$('#dy').value,today:$('#dt').value,block:$('#db').value,pts:+$('#dp').value||0});ls(K+'-me',w);save();R()},
 rmDly(id){const a=act();a.dailies=a.dailies.filter(x=>x.id!=id);save();R()},
 copyDly(){const a=act(),l=a.dailies.filter(d=>d.date==today());if(!l.length)return alert('No hay dailies de hoy');const t=DEPTS.map(p=>{const m=l.filter(d=>d.dept==p);return m.length?`${p} — ${sum(m.map(d=>({pts:d.pts})))} pts\n`+m.map(d=>`- ${d.who}. Ayer: ${d.yest||'—'}. Hoy: ${d.today||'—'}. Bloqueo: ${d.block||'ninguno'}`).join('\n'):''}).filter(Boolean).join('\n\n');navigator.clipboard?.writeText(t).then(()=>alert('Copiado'),()=>prompt('Copia:',t))},
 async saveNow(){const b=$('#sv');b.disabled=true;b.textContent='Guardando…';clearTimeout(ST.timer);S._ts=Date.now();lsSave();
  if(DBU()&&ST.ready){ST.dirty=1;ST.ver++;await flush()}
  b.disabled=false;if(ST.err){b.textContent='⚠ Reintentar';return}ST.last=new Date();b.textContent='✓ Guardado';showStatus();setTimeout(()=>b.textContent='💾 Guardar',2000)},
 theme(){const d=document.documentElement,n=d.dataset.theme=='dark'?'light':'dark';d.dataset.theme=n;ls(K+'-th',n)},
 exp(){saveFile('sprints-binnova.json',JSON.stringify(S,null,1),'application/json')},
 imp(el){const f=el.files[0];if(!f)return;f.text().then(t=>{let d;try{d=JSON.parse(t)}catch(e){}el.value='';if(!d||typeof d!='object'||Array.isArray(d)||!('sprints' in d||'backlog' in d||'projects' in d))return alert('Archivo inválido: no es un respaldo de Sprint Manager');if(!confirm('Importar reemplazará TODOS los datos actuales (y los compartidos, si hay base conectada). ¿Continuar?'))return;const k=S.tab;S=d;ensure();S.tab=k;save();R()})}
};

function head(a){const t=sum(a.items),d=sum(a.items.filter(i=>i.status=='done')),left=Math.max(0,wdays(today(),a.end).length),p=t?Math.round(d/t*100):0;
 return `<div class="card"><div class="row" style="justify-content:space-between"><div><h2>${esc(a.name)} <small>· ${esc(a.dept)}</small></h2><div class="mu">🎯 ${esc(a.goal)||'Sin objetivo definido'}</div><small>${a.start} → ${a.end}</small></div>${ring(p,84)}</div>
 <div class="kpis" style="margin-top:10px"><div class="kpi"><small>Puntos hechos</small><b>${d}/${t}</b></div><div class="kpi"><small>Avance del sprint</small><b>${p}%</b></div><div class="kpi"><small>Días hábiles restantes</small><b>${left}</b></div><div class="kpi"><small>Bloqueados</small><b>${a.items.filter(i=>i.status=='blocked').length}</b></div></div><div class="bar" style="margin-top:10px"><i style="width:${p}%"></i></div></div>`}

function board(){const a=act();if(!a)return empty();
 return head(a)+stack(a)+`<div class="cols">${COLS.map(([k,n])=>{const l=a.items.filter(i=>i.status==k);return `<div class="col" data-c="${k}"><h3>${n} · ${l.length} (${sum(l)} pts)</h3>${l.map(i=>`<div class="it"><div class="t">${esc(i.title)}</div><div class="tag">${esc(i.project)} · ${esc(i.owner)||'sin responsable'} <span class="pt">${i.pts}</span></div><div class="a"><button class="btn s" onclick="A.move('${i.id}',-1)">◀</button><button class="btn s" onclick="A.move('${i.id}',1)">▶</button><button class="btn s" onclick="A.toBack('${i.id}')">↩ backlog</button><button class="btn s d" onclick="A.del('${i.id}')">✕</button></div></div>`).join('')}</div>`}).join('')}</div>`}

function empty(){const s=today();return `<div class="card"><h2>Nuevo Sprint</h2><p class="mu">No hay sprint activo. Define el objetivo y las fechas (lo común: 2 semanas).</p><div class="row"><label>Nombre<input id="sn" placeholder="Sprint 1"></label><label>Departamento${sel('sd',DEPTS)}</label><label>Inicio<input id="ss" type="date" value="${s}"></label><label>Fin<input id="se" type="date" value="${addD(s,13)}"></label></div><label class="mu" style="display:block;margin:8px 0 2px;font-size:12px">Objetivo del Sprint (Sprint Goal)</label><textarea id="sg" style="min-height:60px"></textarea><button class="btn p" style="margin-top:8px" onclick="A.newSprint()">Iniciar sprint</button></div>`}

function plan(){const a=act(),v=avgVel();
 const form=`<div class="card"><h2>Agregar al Product Backlog</h2><div class="row"><label>Actividad<input id="it" size="28"></label><label>Proyecto<input id="ip" list="pl" value="${esc((S.projects.find(p=>p.id==S.pid)||{}).name||PRJ[0])}"><datalist id="pl">${[...new Set([...S.projects.map(p=>p.name),...PRJ])].map(p=>`<option>${esc(p)}`).join('')}</datalist></label><label>Responsable<input id="io" size="14"></label><label>Puntos<select id="ipt">${[1,2,3,5,8,13].map(n=>`<option>${n}</option>`).join('')}</select></label><button class="btn p" onclick="A.add()">Agregar</button></div></div>`;
 const cap=a?`<div class="card"><b>Capacidad:</b> comprometidos ${sum(a.items)} pts · velocidad promedio histórica ${v||'sin datos'} pts ${v&&sum(a.items)>v*1.2?'<b style="color:var(--bad)">⚠ por encima de tu capacidad</b>':''}</div>`:'';
 const bl=`<div class="card"><h2>Product Backlog (${S.backlog.length})</h2><div class="scroll"><table class="tbl"><tr><th>Actividad</th><th>Proyecto</th><th>Resp.</th><th>Pts</th><th></th></tr>${S.backlog.map(i=>`<tr><td>${esc(i.title)}</td><td>${esc(i.project)}</td><td>${esc(i.owner)}</td><td>${i.pts}</td><td>${a?`<button class="btn s" onclick="A.toSprint('${i.id}')">→ Sprint</button> `:''}<button class="btn s d" onclick="A.del('${i.id}')">✕</button></td></tr>`).join('')||'<tr><td colspan=5 class="mu">Vacío</td></tr>'}</table></div></div>`;
 return (a?head(a):empty())+cap+form+bl}

function chart(a){const days=wdays(a.start,a.end),n=days.length;if(n<2)return '';const t=sum(a.items)||1,W=640,H=240,p=34,x=i=>p+i*(W-2*p)/(n-1),y=v=>p+(1-v/t)*(H-2*p);
 const ideal=days.map((_,i)=>`${x(i)},${y(t*(1-i/(n-1)))}`).join(' ');
 const act_=days.map((d,i)=>d<=today()?[x(i),y(t-sum(a.items.filter(z=>z.doneAt&&z.doneAt<=d)))]:null).filter(Boolean);
 return `<svg viewBox="0 0 ${W} ${H}"><line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}" stroke="var(--bd)"/><line x1="${p}" y1="${p}" x2="${p}" y2="${H-p}" stroke="var(--bd)"/><polyline points="${ideal}" fill="none" stroke="var(--mu)" stroke-dasharray="5 4" stroke-width="2"/><polyline points="${act_.map(q=>q.join(',')).join(' ')}" fill="none" stroke="var(--pr)" stroke-width="3"/>${act_.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="var(--pr)"/>`).join('')}<text x="${p-6}" y="${p+4}" text-anchor="end" font-size="11" fill="var(--mu)">${t}</text><text x="${p-6}" y="${H-p+4}" text-anchor="end" font-size="11" fill="var(--mu)">0</text><text x="${p}" y="${H-10}" font-size="11" fill="var(--mu)">${days[0].slice(5)}</text><text x="${W-p}" y="${H-10}" text-anchor="end" font-size="11" fill="var(--mu)">${days[n-1].slice(5)}</text></svg><small>Línea punteada = ideal · línea azul = real (puntos restantes por día hábil)</small>`}

const COL={todo:'#94a3b8',doing:'#3b82f6',blocked:'#c53030',done:'#2f855a'};
function ring(p,z){z=z||92;const r=z/2-8,c=2*Math.PI*r,m=z/2;return `<svg width="${z}" height="${z}" viewBox="0 0 ${z} ${z}"><circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="var(--bd)" stroke-width="9"/><circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="var(--pr)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 ${m} ${m})"/><text x="50%" y="50%" text-anchor="middle" dy=".35em" font-size="${z/4.2}" font-weight="700" fill="var(--tx)">${p}%</text></svg>`}
function donut(pa){const t=pa.reduce((x,q)=>x+q[1],0);if(!t)return '<p class="mu">Sin datos.</p>';let o=0;const r=48,c=2*Math.PI*r;
 return `<div class="ring"><svg width="130" height="130" viewBox="0 0 130 130">${pa.map(q=>{const l=c*q[1]/t,s=`<circle cx="65" cy="65" r="${r}" fill="none" stroke="${q[2]}" stroke-width="20" stroke-dasharray="${l} ${c-l}" stroke-dashoffset="${-o}" transform="rotate(-90 65 65)"/>`;o+=l;return s}).join('')}<text x="65" y="65" text-anchor="middle" dy=".35em" font-size="22" font-weight="700" fill="var(--tx)">${t}</text></svg><div style="display:grid;gap:4px">${pa.map(q=>`<span class="lg"><span><i style="background:${q[2]}"></i>${esc(q[0])}: <b>${q[1]}</b></span></span>`).join('')}</div></div>`}
function hbars(rw,u,mx){const m=mx||Math.max(...rw.map(r=>r[1]),1);return rw.map(r=>`<div style="margin:7px 0"><div class="row" style="justify-content:space-between"><span>${esc(r[0])}</span><b>${r[1]}${u||''}</b></div><div class="bar"><i style="width:${r[1]/m*100}%"></i></div></div>`).join('')||'<p class="mu">Sin datos.</p>'}
function vbars(rw){const m=Math.max(...rw.map(r=>r[1]),1),W=Math.max(300,rw.length*52),H=150;return `<div class="scroll"><svg viewBox="0 0 ${W} ${H+24}" width="${W}">${rw.map((r,i)=>{const h=r[1]/m*H,x=i*52+10;return `<rect x="${x}" y="${H-h}" width="34" height="${h}" rx="4" fill="var(--pr)"/><text x="${x+17}" y="${H-h-4}" text-anchor="middle" font-size="11" fill="var(--tx)">${r[1]}</text><text x="${x+17}" y="${H+15}" text-anchor="middle" font-size="10" fill="var(--mu)">${esc(r[0])}</text>`}).join('')}</svg></div>`}

const PAL=['#1e3a8a','#c9a227','#2f855a','#c53030','#3b82f6','#8b5cf6','#0891b2','#ea580c'],ringc=(p,z,c)=>ring(p,z).replace('stroke="var(--pr)"','stroke="'+c+'"');
function stack(a){const t=sum(a.items);if(!t)return '';const q=k=>sum(a.items.filter(i=>i.status==k));return `<div class="card"><div style="display:flex;height:22px;border-radius:11px;overflow:hidden;background:var(--in)">${COLS.map(([k,n])=>q(k)?`<div title="${n}: ${q(k)} pts" style="width:${q(k)/t*100}%;background:${COL[k]}"></div>`:'').join('')}</div><div class="lg" style="margin-top:8px;flex-wrap:wrap;gap:14px">${COLS.map(([k,n])=>`<span><i style="background:${COL[k]}"></i>${n}: <b>${q(k)} pts</b></span>`).join('')}</div></div>`}
function gbars(rw){const W=Math.max(300,rw.length*84),H=140,m=Math.max(...rw.flatMap(r=>[r[1],r[2]]),1);return `<div class="scroll"><svg viewBox="0 0 ${W} ${H+28}" width="${W}">${rw.map((r,i)=>{const x=i*84+8,h1=r[1]/m*H,h2=r[2]/m*H;return `<rect x="${x}" y="${H-h1}" width="28" height="${h1}" rx="4" fill="#94a3b8"/><rect x="${x+32}" y="${H-h2}" width="28" height="${h2}" rx="4" fill="var(--pr)"/><text x="${x+14}" y="${H-h1-4}" text-anchor="middle" font-size="11" fill="var(--tx)">${r[1]}</text><text x="${x+46}" y="${H-h2-4}" text-anchor="middle" font-size="11" fill="var(--tx)">${r[2]}</text><text x="${x+30}" y="${H+16}" text-anchor="middle" font-size="10" fill="var(--mu)">${esc(String(r[0]).slice(0,11))}</text>`}).join('')}</svg></div><div class="lg" style="gap:14px"><span><i style="background:#94a3b8"></i>Comprometido</span><span><i style="background:var(--pr)"></i>Entregado</span></div>`}
function dviz(a){if(!a.dailies.length)return '';const by={};a.dailies.forEach(d=>by[d.who]=(by[d.who]||0)+d.pts);const nb=a.dailies.filter(d=>(d.block||'').trim()).length;return `<div class="g3"><div class="card"><h2>Bloqueos reportados</h2>${donut([['Con bloqueo',nb,COL.blocked],['Sin bloqueo',a.dailies.length-nb,COL.done]])}</div><div class="card"><h2>Puntos por persona</h2>${hbars(Object.entries(by).sort((x,y)=>y[1]-x[1]))}</div></div>`}
function metrics(){const a=act();if(!a)return empty();const wd=wdays(a.start,a.end),ex=wd.length?Math.round(wd.filter(d=>d<=today()).length/wd.length*100):0,tt=sum(a.items),rl=tt?Math.round(sum(a.items.filter(i=>i.status=='done'))/tt*100):0,ok=rl>=ex-5,pp={};a.items.forEach(i=>pp[i.project]=(pp[i.project]||0)+i.pts);const it=a.items,st=COLS.map(([k,n])=>[n,it.filter(i=>i.status==k).length,COL[k]]),ow={},pr={},dd={},dp={};
 it.forEach(i=>{const o=i.owner||'Sin responsable';ow[o]=(ow[o]||0)+i.pts;(pr[i.project]=pr[i.project]||[]).push(i)});a.dailies.forEach(d=>{dd[d.date]=(dd[d.date]||0)+d.pts;dp[d.dept]=(dp[d.dept]||0)+d.pts});
 const dr=Object.entries(dd).sort().map(([d,v])=>[d.slice(5),v]),pe=Object.entries(pr).map(([p,l])=>[p,Math.round(sum(l.filter(i=>i.status=='done'))/sum(l)*100)]);
 return head(a)+`<div class="g3"><div class="card"><h2>Estado de las actividades</h2>${donut(st)}</div><div class="card"><h2>Carga por responsable (pts)</h2>${hbars(Object.entries(ow).sort((x,y)=>y[1]-x[1]))}</div></div><div class="card"><h2>Burndown</h2>${chart(a)}</div><div class="g3"><div class="card"><h2>Salud del sprint</h2><div class="ring">${ringc(rl,100,ok?COL.done:COL.blocked)}${ringc(ex,100,'#94a3b8')}<div><p><b>Real:</b> ${rl}% entregado<br><b>Esperado:</b> ${ex}% del calendario</p><span class="ch ${ok?'g':'r'}">${ok?'En ritmo':'Por debajo del ritmo'}</span></div></div></div><div class="card"><h2>Puntos por proyecto</h2>${donut(Object.entries(pp).map(([k,v],i)=>[k,v,PAL[i%PAL.length]]))}</div></div>
 <div class="g3"><div class="card"><h2>Puntos reportados por día (Daily)</h2>${dr.length?vbars(dr):'<p class="mu">Registra dailies para ver esta gráfica.</p>'}</div><div class="card"><h2>Puntos de Daily por departamento</h2>${hbars(Object.entries(dp))}</div></div>
 <div class="card"><div class="row" style="justify-content:space-between"><h2>Avance por proyecto</h2><span class="row noprint"><button class="btn" onclick="print()">Imprimir / PDF</button><button class="btn p" onclick="A.copy()">Copiar para Bi-nnova</button></span></div>${hbars(pe,'%',100)}</div>`}

function close_(){const a=act();if(!a)return empty();const dn=a.items.filter(i=>i.status=='done'),pd=a.items.filter(i=>i.status!='done'),c=sum(a.items),v=sum(dn),p=c?Math.round(v/c*100):0,
 li=i=>`<div class="li"><span>${esc(i.title)} <small>· ${esc(i.project)}</small></span><span class="pt">${i.pts}</span></div>`,
 ta=(f,l,h,x,col)=>`<div class="rc" style="border-color:${col}"><h3 style="margin:0;font-size:14px">${l}</h3><small>${h}</small><textarea oninput="A.note('${f}',this.value)">${esc(x)}</textarea></div>`;
 return `<div class="card"><h2>Sprint Review · ${esc(a.name)}</h2><div class="ring">${ring(p,110)}<div><p><b>${v}</b> de <b>${c}</b> puntos comprometidos fueron entregados.</p><p class="mu">Velocidad promedio anterior: ${avgVel()||'sin datos'} pts. Compara lo planeado con lo realizado.</p></div></div>
 <div class="g3" style="margin-top:12px"><div><h3 style="font-size:13px;color:var(--ok)">✅ Entregado (${dn.length})</h3>${dn.map(li).join('')||'<p class="mu">Aún nada terminado</p>'}</div><div><h3 style="font-size:13px;color:var(--bad)">↩ Regresa al backlog (${pd.length})</h3>${pd.map(li).join('')||'<p class="mu">Todo terminado</p>'}</div></div>
 ${ta('review','Retroalimentación de interesados','¿Qué dijeron del incremento? ¿Qué cambia en el backlog?',a.review,'var(--pr)')}</div>
 <div class="card"><h2>Retrospectiva del equipo</h2><div class="g3" style="margin:0">${ta('bien','😊 ¿Qué salió bien?','Mantener',a.retro.bien,'#2f855a')}${ta('mejorar','🔧 ¿Qué mejorar?','Problemas y causas',a.retro.mejorar,'#c9a227')}${ta('acc','🎯 Acciones','Para el próximo sprint, con responsable',a.retro.acc,'#3b82f6')}</div></div>
 <button class="btn p" onclick="A.close()">Cerrar sprint</button>`}

function hist(){const c=closedSprints();if(!c.length)return `<div class="card mu">Aún no hay sprints cerrados.</div>`;const mx=Math.max(...c.map(s=>Math.max(s.velocity,s.committed)),1);
 return `<div class="card"><h2>Comprometido vs entregado</h2>${gbars(c.map(s=>[s.name,s.committed,s.velocity]))}</div><div class="card"><h2>Velocidad por sprint</h2><p class="mu">Promedio: <b>${avgVel()} pts</b> — úsalo como capacidad para planear el siguiente.</p>${c.map(s=>`<div style="margin:8px 0"><div class="row" style="justify-content:space-between"><span>${esc(s.name)} <small>${esc(s.dept)}</small></span><b>${s.velocity}/${s.committed} pts (${s.committed?Math.round(s.velocity/s.committed*100):0}%)</b></div><div class="bar"><i style="width:${s.velocity/mx*100}%"></i></div></div>`).join('')}</div>`
 +c.slice().reverse().map(s=>`<div class="card"><h2>${esc(s.name)} <small>${s.start} → ${s.end}</small></h2><div>🎯 ${esc(s.goal)}</div><details><summary>Review y retrospectiva</summary><p><b>Review:</b> ${esc(s.review)||'—'}</p><p><b>Bien:</b> ${esc(s.retro.bien)||'—'}</p><p><b>Mejorar:</b> ${esc(s.retro.mejorar)||'—'}</p><p><b>Acciones:</b> ${esc(s.retro.acc)||'—'}</p></details></div>`).join('')}

function proj(){const p=A.pj(),EST=['Pendiente','En curso','Hecho'],TN={g:'Positiva',n:'Neutral',r:'Preocupación'},ho=p.ms.filter(m=>m.st==2).length,c=t=>p.vw.filter(v=>v.tone==t).length;
 const add=(k,ph)=>`<div class="row noprint" style="margin-top:8px">${ph}<button class="btn p" onclick="A.addp('${k}')">Agregar</button></div>`,x=(k,i)=>`<button class="btn s d noprint" onclick="A.rmp('${k}',${i})">✕</button>`;

 ${p.note?`<div class="note">🔒 ${esc(p.note)}</div>`:''}
 <div class="card"><div class="row" style="justify-content:space-between"><h2>${esc(p.name)}</h2><span class="row noprint"><button class="btn" onclick="A.tpl()">Cargar plantilla sugerida</button><button class="btn" onclick="A.renProj()">Renombrar</button><button class="btn d" onclick="A.delProj()">Eliminar</button><button class="btn" onclick="A.rep()">Copiar resumen</button><button class="btn p" onclick="print()">Imprimir / PDF</button></span></div>

 <div class="card"><h2>Hitos</h2>${p.ms.map((m,i)=>`<div class="li"><span>${esc(m.t)}</span><span><button class="btn s" onclick="A.cyc(${i})">${EST[m.st]}</button> ${x('ms',i)}</span></div>`).join('')||'<p class="mu">Sin hitos.</p>'}${add('ms','<input id="mst" placeholder="Nuevo hito" size="26">')}</div>
 <div class="card"><h2>Riesgos y bloqueos</h2>${p.rk.map((r,i)=>`<div class="li"><span>${esc(r.t)}</span>${x('rk',i)}</div>`).join('')||'<p class="mu">Sin riesgos.</p>'}${add('rk','<input id="rkt" placeholder="Riesgo o bloqueo" size="26">')}</div></div>
 <div class="card"><h2>Puntos de vista sobre el avance</h2>${p.vw.map((v,i)=>`<div class="li"><span><b>${esc(v.who)}</b> <small>${esc(v.role)}</small> <span class="ch ${v.tone}">${TN[v.tone]}</span><br>${esc(v.t)}</span>${x('vw',i)}</div>`).join('')||'<p class="mu">Aún nadie ha opinado.</p>'}
 ${add('vw','<label>Nombre<input id="vww" size="14"></label><label>Rol<input id="vwr" size="14" placeholder="Líder, usuario…"></label><label>Postura<select id="vto"><option value="g">Positiva</option><option value="n">Neutral</option><option value="r">Preocupación</option></select></label><label>Comentario<input id="vwt" size="34" placeholder="¿Qué opina del avance?"></label>')}</div>
 <div class="card"><h2>Acuerdos y siguientes pasos</h2>${p.dc.map((d,i)=>`<div class="li"><span>${esc(d.t)} <small>· ${esc(d.who)||'s/r'} ${esc(d.due)}</small></span>${x('dc',i)}</div>`).join('')||'<p class="mu">Sin acuerdos.</p>'}${add('dc','<label>Acuerdo<input id="dct" size="30"></label><label>Responsable<input id="dcw" size="14"></label><label>Fecha<input id="dcd" type="date"></label>')}</div>`}
function topics(){const t=A.tp(),TN={g:'Positiva',n:'Neutral',r:'Preocupación'},me=esc(ls(K+'-me')||'');
 return `<div class="row noprint" style="margin-bottom:12px">${S.topics.map(q=>`<button class="btn ${q.id==t.id?'p':''}" onclick="A.pickT('${q.id}')">${esc(q.name)} <small>(${q.posts.length})</small></button>`).join('')}<button class="btn" onclick="A.newTopic()">＋ Nuevo tema</button></div>
 <div class="card"><div class="row" style="justify-content:space-between"><h2>${esc(t.name)}</h2><span class="row noprint"><button class="btn" onclick="A.renTopic()">Renombrar</button><button class="btn d" onclick="A.delTopic()">Eliminar tema</button></span></div>
 <label class="mu" style="font-size:12px">De qué trata este tema</label><textarea style="min-height:50px" oninput="A.tset('desc',this.value)">${esc(t.desc)}</textarea></div>
 ${t.posts.length?`<div class="card"><h2>Ánimo del tema</h2>${donut(Object.keys(TN).map(k=>[TN[k],t.posts.filter(x=>x.tone==k).length,{g:COL.done,n:'#94a3b8',r:COL.blocked}[k]]))}</div>`:''}<div class="card"><h2>Opiniones (${t.posts.length})</h2>${t.posts.slice().reverse().map(v=>`<div class="li"><span><b>${esc(v.who)}</b> <small>${esc(v.role)} · ${esc(v.date)}</small> <span class="ch ${v.tone}">${TN[v.tone]||''}</span><br>${esc(v.t)}</span><span class="noprint"><button class="btn s" onclick="A.like('${v.id}')">👍 ${v.likes||0}</button> <button class="btn s d" onclick="A.delPost('${v.id}')">✕</button></span></div>`).join('')||'<p class="mu">Aún nadie ha opinado en este tema.</p>'}</div>
 <div class="card noprint"><h2>Agregar mi opinión</h2><div class="row"><label>Nombre<input id="tw" size="16" value="${me}"></label><label>Rol<input id="tr" size="16" placeholder="Líder, usuario…"></label><label>Postura<select id="tto"><option value="g">Positiva</option><option value="n">Neutral</option><option value="r">Preocupación</option></select></label></div><label class="mu" style="display:block;margin:8px 0 2px;font-size:12px">Comentario</label><textarea id="tt" style="min-height:70px" placeholder="¿Qué opinas? ¿Qué propones?"></textarea><button class="btn p" style="margin-top:8px" onclick="A.post()">Publicar</button></div>`}

function syncv(){
 return `<div class="card"><h2>Compartir con el equipo</h2><p>Estado: <b>${DBU()?(ST.err||'☁ Conectado a la base de datos compartida'):'Solo en este navegador (nadie más ve tus cambios)'}</b></p>
 <p class="mu">Los datos se guardan en este artefacto y los ve todo el que tenga acceso. Para que alguien pueda capturar y opinar, compártelo desde el menú de compartir con permiso de <b>Contributor</b> o superior. Con permiso solo de lectura, la persona ve los datos pero no puede modificarlos.</p>
 <div class="row" style="margin-top:10px"><label>Tu nombre (se usa para firmar tus opiniones)<input size="24" value="${esc(ls(K+'-me')||'')}" onchange="A.me(this.value)"></label></div></div>
 <div class="card"><div class="note">No captures información confidencial (casos del Comité de Ética, datos personales). Si dos personas editan al mismo tiempo, prevalece el último guardado. Usa <b>Exportar</b> para respaldar.</div></div>
 <div class="card"><h2>Acceso de administrador</h2><p class="mu">Usuario: <b>${esc((getAuth()||{}).u||'')}</b></p><div class="row"><label>Contraseña actual<input id="cpo" type="password" autocomplete="current-password"></label><label>Nueva contraseña (mín. 8)<input id="cpn" type="password" autocomplete="new-password"></label><button class="btn p" onclick="G.chpw()">Cambiar contraseña</button></div></div>`}

function daily(){const a=act();if(!a)return empty();const me=esc(ls(K+'-me')||''),ds=[...new Set(a.dailies.map(d=>d.date))].sort().reverse(),nb=a.dailies.filter(d=>(d.block||'').trim()).length;
 return head(a)+dviz(a)+`<div class="card noprint"><h2>Registrar Daily Scrum</h2><p class="mu">Reunión breve (≈15 min) para ver cómo avanza el Sprint. Cada integrante responde tres preguntas.</p><div class="row"><label>Departamento${sel('dd',DEPTS)}</label><label>Nombre<input id="dw" size="14" value="${me}"></label><label>Puntos del día<input id="dp" type="number" min="0" value="0" style="width:80px"></label></div><div class="row" style="margin-top:8px"><label>Ayer: ¿qué hice?<input id="dy" size="30"></label><label>Hoy: ¿qué haré?<input id="dt" size="30"></label><label>¿Tengo bloqueos?<input id="db" size="26" placeholder="Vacío si no hay"></label><button class="btn p" onclick="A.dly()">Agregar</button></div></div>
 <div class="card"><div class="row" style="justify-content:space-between"><h2>Dailies del sprint (${a.dailies.length}) <small>· bloqueos reportados: ${nb}</small></h2><button class="btn noprint" onclick="A.copyDly()">Copiar de hoy para Bi-nnova</button></div>${ds.map(f=>{const l=a.dailies.filter(d=>d.date==f);return `<h3 style="font-size:13px;margin:12px 0 4px;color:var(--mu)">${f} · ${sum(l.map(d=>({pts:d.pts})))} pts del día</h3>`+l.map(d=>`<div class="li"><span><b>${esc(d.who)}</b> <small>${esc(d.dept)} · ${d.pts} pts</small><br>Ayer: ${esc(d.yest)||'—'}<br>Hoy: ${esc(d.today)||'—'}<br>${(d.block||'').trim()?`<span class="ch r">Bloqueo</span> ${esc(d.block)}`:'<small>Sin bloqueos</small>'}</span><button class="btn s d noprint" onclick="A.rmDly('${d.id}')">✕</button></div>`).join('')}).join('')||'<p class="mu">Aún no hay dailies en este sprint.</p>'}</div>`}

function guide(){const d=(t,b,o)=>`<details class="card" ${o?'open':''}><summary><b>${t}</b></summary>${b}</details>`;
 return `<div class="note">Guía rápida de Scrum centrada en el <b>Sprint</b>. Cada sección indica en qué pestaña de esta herramienta se aplica.</div>`
 +d('1. Agile y Scrum en pocas palabras',`<p><b>Agile</b>: trabajar poco a poco, de forma organizada y con revisiones constantes, en vez de esperar al final para saber si algo salió bien. <b>Scrum</b>: método de Agile que organiza el trabajo en periodos cortos (Sprints) con reuniones y herramientas de seguimiento.</p><p><b>Planear → Trabajar → Revisar → Detectar problemas → Mejorar → Volver a trabajar.</b></p>`,1)
 +d('2. El ciclo del Sprint',`<div class="scroll"><table class="tbl"><tr><th>Etapa</th><th>Pregunta clave</th><th>En esta herramienta</th></tr><tr><td>Product Backlog</td><td>¿Qué hay que hacer?</td><td>Planeación</td></tr><tr><td>Sprint Planning</td><td>¿Qué haremos en este Sprint?</td><td>Planeación → "→ Sprint"</td></tr><tr><td>Sprint</td><td>¡Manos a la obra!</td><td>Tablero</td></tr><tr><td>Daily Scrum</td><td>¿Qué hice, qué haré, qué me detiene?</td><td>Daily Scrum</td></tr><tr><td>Seguimiento</td><td>¿Realmente avanzamos?</td><td>Métricas y Proyectos</td></tr><tr><td>Sprint Review</td><td>¿Qué logramos?</td><td>Review y Retro</td></tr><tr><td>Retrospectiva</td><td>¿Cómo mejoramos?</td><td>Review y Retro</td></tr></table></div><p class="mu">Al terminar la retrospectiva empieza un nuevo Sprint y el ciclo se repite hasta cerrar el proyecto.</p>`)
 +d('3. El Sprint: reglas básicas',`<ul><li><b>Periodo fijo</b> (timebox) de 1 a 4 semanas; lo común son 2. Al terminar uno empieza el siguiente sin pausas.</li><li><b>Sprint Goal</b>: el objetivo del Sprint. No cambia durante el Sprint; el alcance sí se puede renegociar si hay nueva información.</li><li><b>Duración constante</b>: no se alarga el Sprint para "terminar un poco más". Lo no terminado regresa al backlog (la herramienta lo hace al cerrar).</li><li><b>Calidad constante</b>: algo está "Hecho" solo si cumple la Definición de Terminado.</li><li>Solo el Product Owner puede cancelar un Sprint, y es raro.</li></ul>`)
 +d('4. Sprint Planning: por qué, qué y cómo',`<ul><li><b>¿Por qué?</b> Define el objetivo del Sprint.</li><li><b>¿Qué?</b> Elige del backlog lo que cabe. Ejemplo: de 10 tareas, 3 se hacen ahora, 2 después y 5 aún no se pueden hacer.</li><li><b>¿Cómo?</b> Reparte responsables y divide lo grande en tareas pequeñas.</li></ul><p><b>Puntos:</b> estiman el esfuerzo relativo (1, 2, 3, 5, 8, 13). Usa la <b>velocidad promedio</b> de sprints anteriores como capacidad; la herramienta avisa si te comprometes por encima de ella.</p>`)
 +d('5. Daily Scrum',`<ul><li>Dura unos 15 minutos y se hace todos los días a la misma hora.</li><li><b>Ayer</b>: ¿qué hice? · <b>Hoy</b>: ¿qué haré? · <b>Bloqueos</b>: ¿qué me impide avanzar?</li><li>Se registra la <b>puntuación del día</b>. Ejemplo: Desarrollo de Software terminó una parte del portal (8 pts), hoy hará pruebas, bloqueo: espera información de otro departamento.</li><li>Sirve para detectar bloqueos a tiempo y evitar que un proyecto se estanque sin seguimiento. No es una reunión para resolver el problema, solo para verlo.</li></ul>`)
 +d('6. Seguimiento del avance',`<ul><li><b>Burndown</b>: la línea real debe seguir la ideal. Si se queda arriba, hay atraso.</li><li><b>% de avance por proyecto</b>: Semana 1 20% → Semana 2 35% → Semana 3 50% → Semana 4 70%. Mira la tendencia, no un solo dato.</li><li>En Bi-nnova se registra el % de avance, las actividades realizadas, pendientes y bloqueos. Usa <b>Copiar para Bi-nnova</b> en Métricas.</li></ul>`)
 +d('7. Review y Retrospectiva',`<div class="scroll"><table class="tbl"><tr><th></th><th>Sprint Review</th><th>Retrospectiva</th></tr><tr><td>Revisa</td><td>El <b>producto</b>: lo planeado vs. lo hecho</td><td>La <b>forma de trabajar</b> del equipo</td></tr><tr><td>Participan</td><td>Equipo e interesados</td><td>Solo el equipo</td></tr><tr><td>Resultado</td><td>Ajustes al backlog</td><td>Acciones concretas para el próximo Sprint</td></tr></table></div><p>Ejemplo: "Nos atrasamos porque las tareas no estaban bien distribuidas" → acción: "Asignar responsables desde el inicio".</p>`)
 +d('8. Roles, artefactos y Definición de Terminado',`<ul><li><b>Product Owner</b>: decide el orden de prioridad del backlog. <b>Scrum Master</b>: cuida que se siga el proceso y quita obstáculos. <b>Developers</b>: hacen el trabajo del Sprint.</li><li><b>Artefactos</b>: Product Backlog (meta: Product Goal), Sprint Backlog (meta: Sprint Goal) e Incremento (meta: Definición de Terminado).</li><li><b>Definición de Terminado</b>: lista acordada de lo que debe cumplirse para dar algo por hecho (probado, revisado, publicado).</li></ul>`)
 +d('9. Para memorizarlo: organizar una fiesta',`<p>Backlog: comprar comida, reservar lugar, invitaciones, decorar. Planning: esta semana comida e invitaciones. Sprint: una semana para lograrlo. Daily: ¿qué hiciste, qué harás, qué problema tienes? Seguimiento: ¿qué % de la fiesta está listo? Review: ¿qué logramos? Retro: ¿qué mejoramos? Y vuelta a empezar.</p>`)
 +d('10. Errores comunes',`<ul><li>Meter más actividades al Sprint sin sacar otras.</li><li>Dailies largos o que se vuelven reportes para el jefe.</li><li>Saltarse la retrospectiva: sin ella no se mejora.</li><li>Dar por "Hecho" lo que no cumple la Definición de Terminado.</li><li>Cambiar el Sprint Goal a la mitad del Sprint.</li></ul>`)}

function R(){$('#nav').innerHTML=TABS.map(([k,n])=>`<button class="${S.tab==k?'on':''}" onclick="A.tab('${k}')">${n}</button>`).join('');
 $('#v').innerHTML=({board,daily,guide,plan,proj,topics,metrics,close:close_,hist,sync:syncv}[S.tab]||board)();FD=0;ST.pending=0;showStatus()}

// ===== ACCESO DE ADMINISTRADOR =====
// Nota: es una barrera de acceso en el navegador (sin servidor). No sustituye una autenticación real.
const AK=K+'-auth',SK=K+'-sess',getAuth=()=>{try{return JSON.parse(ls(AK))}catch(e){return null}};
async function hash(t,s){const m=s+':'+t;if(window.crypto&&crypto.subtle)return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(m)))].map(x=>x.toString(16).padStart(2,'0')).join('');let h=5381;for(const c of m)h=((h<<5)+h+c.charCodeAt(0))|0;return'f'+h}
const normCode=c=>String(c).replace(/[^A-Za-z0-9]/g,'').toUpperCase();
const G={tries:0,until:0,
 box(h){$('#gate').innerHTML=`<div class="gcard"><div class="gl">◈</div><h1>Sprint Manager</h1><p class="mu" style="margin:0 0 6px">Coordinación de Política Digital · Complemento de Bi-nnova</p>${h}</div>`},
 msg(t){const e=$('#gm');if(e)e.textContent=t},
 show(m){const a=getAuth(),pw=(id,l,ac)=>`<label>${l}<input id="${id}" type="password" autocomplete="${ac}"></label>`,u=`<label>Usuario<input id="gu" autocomplete="username" value="${m=='login'&&a?esc(a.u):''}"></label>`,back=`<p style="text-align:center"><a href="#" onclick="G.show('login');return false">← Volver a iniciar sesión</a></p>`;
  G.box({
   login:`<form onsubmit="G.login();return false">${u}${pw('gp','Contraseña','current-password')}<div class="gm" id="gm"></div><button class="btn p">Entrar como administrador</button></form><p style="text-align:center"><a href="#" onclick="G.show('forgot');return false">¿Olvidaste tu contraseña?</a></p>`,
   setup:`<h2>Primer uso: crea el administrador</h2><form onsubmit="G.setup();return false">${u}${pw('gp','Contraseña (mínimo 8 caracteres)','new-password')}${pw('gc','Repite la contraseña','new-password')}<div class="gm" id="gm"></div><button class="btn p">Crear cuenta y entrar</button></form><div class="note" style="margin-top:12px">Los datos y el acceso viven en este navegador. Es una barrera de acceso, no seguridad de servidor.</div>`,
   forgot:`<h2>Recuperar contraseña</h2><form onsubmit="G.reset();return false"><label>Código de recuperación<input id="gq" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off"></label>${pw('gp','Nueva contraseña (mínimo 8)','new-password')}${pw('gc','Repite la nueva contraseña','new-password')}<div class="gm" id="gm"></div><button class="btn p">Restablecer contraseña</button></form><div class="note" style="margin-top:12px">El código se mostró al crear la cuenta. Sin servidor no hay correo de recuperación: si lo perdiste, la única salida es borrar los datos del sitio en el navegador (elimina también los sprints locales; exporta respaldos seguido).</div>${back}`
  }[m])},
 async store(u,p,old){const o=old||{},s=uid()+uid();let code=null,r=o.r,rh=o.rh;if(!rh){const b=new Uint8Array(16);crypto.getRandomValues(b);const al='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';code=[...b].map(x=>al[x%al.length]).join('').replace(/(.{4})(?=.)/g,'$1-');r=uid()+uid();rh=await hash(normCode(code),r)}
  ls(AK,JSON.stringify({u,s,ph:await hash(p,s),r,rh}));return code},
 async setup(){const u=$('#gu').value.trim(),p=$('#gp').value;if(!u)return G.msg('Escribe un nombre de usuario');if(p.length<8)return G.msg('La contraseña debe tener al menos 8 caracteres');if(p!==$('#gc').value)return G.msg('Las contraseñas no coinciden');G.reveal(await G.store(u,p))},
 locked(){if(Date.now()<G.until){G.msg('Demasiados intentos. Espera '+Math.ceil((G.until-Date.now())/1000)+' s');return 1}},
 fail(t){if(++G.tries>=5){G.until=Date.now()+30000;G.tries=0}G.msg(t)},
 async login(){if(G.locked())return;const a=getAuth();if(a&&$('#gu').value.trim().toLowerCase()==a.u.toLowerCase()&&await hash($('#gp').value,a.s)==a.ph){G.tries=0;G.enter()}else G.fail('Usuario o contraseña incorrectos')},
 async reset(){if(G.locked())return;const a=getAuth(),p=$('#gp').value;if(!a)return G.show('setup');if(p.length<8)return G.msg('La nueva contraseña debe tener al menos 8 caracteres');if(p!==$('#gc').value)return G.msg('Las contraseñas no coinciden');
  if(await hash(normCode($('#gq').value),a.r)!=a.rh)return G.fail('Código de recuperación incorrecto');G.tries=0;G.reveal(await G.store(a.u,p))},
 reveal(code){G.cd=code;G.box(`<h2>Guarda tu código de recuperación</h2><p class="mu">Es la única forma de recuperar la contraseña. Se muestra una sola vez: guárdalo en un lugar seguro.</p><div class="gcode">${code}</div><div class="row"><button class="btn" onclick="G.dl()">⬇ Descargar</button><button class="btn" onclick="navigator.clipboard&&navigator.clipboard.writeText(G.cd)">Copiar</button></div><button class="btn p" onclick="G.cd=null;G.enter()">Ya lo guardé, entrar</button>`)},
 dl(){saveFile('codigo-recuperacion-sprint-manager.txt','Sprint Manager · código de recuperación\n'+G.cd+'\n','text/plain')},
 enter(){try{sessionStorage.setItem(SK,'1')}catch(e){}G.unlock()},
 unlock(){document.body.classList.remove('locked');R();if(!G.db){G.db=1;initDb()}},
 out(){try{sessionStorage.removeItem(SK)}catch(e){}document.body.classList.add('locked');G.show('login')},
 async chpw(){const a=getAuth(),n=$('#cpn').value;if(!a||await hash($('#cpo').value,a.s)!=a.ph)return alert('La contraseña actual no es correcta');if(n.length<8)return alert('La nueva contraseña debe tener al menos 8 caracteres');await G.store(a.u,n,a);alert('Contraseña actualizada');R()},
 boot(){let ok=0;try{ok=sessionStorage.getItem(SK)=='1'}catch(e){}const a=getAuth();a&&ok?G.unlock():G.show(a?'login':'setup')}};
G.boot();
</script></body></html>
